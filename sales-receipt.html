<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Sales Receipt | Jubeliwatch</title>
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
    <meta name="theme-color" content="#15100c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400..800&display=swap">
    <link rel="stylesheet" href="theme-dark.css">
    <link rel="stylesheet" href="layanan.css">
    <script src="util.js"></script>
    <script src="layanan-config.js"></script>
    <script src="layanan.js"></script>
</head>
<body class="nota-body">
    <div class="nota-bar" id="bar" hidden>
        <button type="button" class="ly-btn ly-btn--pri" id="cetak">Save PDF / Print</button>
    </div>
    <main id="isi"><p class="ly-kosong">Loading&hellip;</p></main>

    <script>
(function () {
    var L = Layanan, C = L.C, E = L.esc, isi = document.getElementById('isi');
    var NAMA = { dp: 'Deposit', tambahan: 'Payments', pelunasan: 'Final payment', refund: 'Refunded' }, METODE = { tunai: 'tunai', transfer: 'transfer', qris: 'QRIS' };

    function nota(j) {
        var t = C.toko, h = L.hitungJual(j), i = L.infoJual(j);
        var cap = j.status === 'batal' ? '<span class="nota-lunas dp">CANCELLED</span>' : h.lunas ? '<span class="nota-lunas">PAID</span>' : '<span class="nota-lunas dp">DEPOSIT</span>';
        document.title = 'Receipt ' + j.kode + ' | ' + t.nama;
        isi.innerHTML = '<article class="nota">' + L.kopNota(j.status === 'dp' ? 'Order Confirmation' : 'Sales Receipt', j.kode, cap) +
            '<dl class="nota-info">' +
            '<div><dt>Buyer</dt><dd>' + E(j.nama) + '</dd></div><div><dt>Phone</dt><dd>' + E(j.hp_samar) + '</dd></div>' +
            '<div><dt>Date</dt><dd>' + L.tgl(j.tgl) + '</dd></div>' +
            '<div><dt>Status</dt><dd>' + E(L.STATUS_JUAL[j.status] || j.status) + '</dd></div>' +
            (j.status === 'dp' ? '<div><dt>Held until</dt><dd>' + L.tgl(j.batas_lunas) + (i.lewat ? ' (overdue)' : '') + '</dd></div>' : '') +
            (j.tgl_selesai ? '<div><dt>Handed over</dt><dd>' + L.tgl(j.tgl_selesai) + '</dd></div>' : '') +
            (j.tgl_batal ? '<div><dt>Cancelled</dt><dd>' + L.tgl(j.tgl_batal) + (j.batal_oleh === 'toko' ? ' (by the shop)' : '') + '</dd></div>' : '') + '</dl>' +

            '<table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Subtotal</th></tr></thead><tbody>' +
            (j.items || []).map(function (it) { return '<tr><td>' + E(it.nama) + '</td><td class="r">' + (it.qty || 1) + '</td><td class="r">' + L.rupiah(it.harga) + '</td><td class="r">' + L.rupiah(it.harga * (it.qty || 1)) + '</td></tr>'; }).join('') +
            '</tbody></table>' +

            '<div class="nota-tot"><div class="t"><span>Total</span><span>' + L.rupiah(h.total) + '</span></div>' +
            (j.bayar || []).map(function (b) { return '<div><span>' + NAMA[b.jenis] + ' ' + L.tgl(b.tgl) + ' (' + (METODE[b.metode] || b.metode) + ')</span><span>' + (b.jenis === 'refund' ? '−' : '') + L.rupiah(b.jumlah) + '</span></div>'; }).join('') +
            (j.status === 'batal' ? '<div><span>Cancellation fee</span><span>' + L.rupiah(h.potongan) + '</span></div><div class="s"><span>Refunded to the buyer</span><span>' + L.rupiah(h.kembali || h.harusKembali) + '</span></div>'
                : '<div class="s"><span>Balance due</span><span>' + L.rupiah(h.sisa) + '</span></div>') + '</div>' +

            (j.status === 'dp' && h.sisa ? '<h2>Paying the balance</h2><div class="nota-rek">Cash at the shop or transfer to:<br>' + t.rekening.map(function (r) { return '<b>' + E(r.bank) + ' ' + E(r.nomor) + '</b> a.n. ' + E(r.atasNama); }).join('<br>') + '<br><small>Send the transfer receipt to WhatsApp +' + E(t.wa) + '.</small></div>' : '') +

            (j.status === 'dp' || j.status === 'batal' ? '<h2>Order terms</h2><ol>' + L.ketentuanJual(j).map(function (x) { return '<li>' + E(x) + '</li>'; }).join('') + '</ol>' : '') +
            '<p class="nota-foot">' + (j.status === 'dp' ? (j.disetujui ? 'The buyer agreed on WhatsApp on ' + L.tglPanjang(j.disetujui) + '.' : 'Waiting for the buyer to agree on WhatsApp (reply AGREE).') + '<br>' : '') +
            'Thank you for shopping at ' + E(t.nama) + '.<br>You can open this receipt again at jubeliwatch.github.io/sales-receipt.html</p></article>';
        document.getElementById('bar').hidden = false;
    }
    document.getElementById('cetak').addEventListener('click', function () { window.print(); });
    L.halamanKode({ isi: isi, kunci: 'jubeli-nota-jual', jenis: 'jual', halaman: 'sales-receipt.html', judul: 'Sales receipt', labelKode: 'Order code', contoh: 'JUL-XXXXXX', tombol: 'Open receipt', tampil: nota });
})();
    </script>
</body>
</html>
