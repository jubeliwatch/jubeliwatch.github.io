<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Agreement | Jubeliwatch</title>
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
    <meta name="theme-color" content="#15100c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400..800&display=swap">
    <link rel="stylesheet" href="theme-dark.css">
    <link rel="stylesheet" href="layanan.css">
    <script src="util.js"></script>
    <script src="layanan-config.js"></script>
    <script src="layanan.js"></script>
</head>
<body class="nota-body">
    <div class="nota-bar" id="bar" hidden>
        <button type="button" class="ly-btn ly-btn--pri" id="cetak">Save PDF / Print</button>
    </div>
    <main id="isi"><p class="ly-kosong">Loading&hellip;</p></main>

    <script>
(function () {
    var L = Layanan, C = L.C, E = L.esc, isi = document.getElementById('isi');

    function surat(t) {
        var toko = C.toko;
        var cap = t.status === 'ditebus' ? '<span class="nota-lunas">BOUGHT BACK</span>' : t.status === 'milik_toko' ? '<span class="nota-lunas dp">SHOP PROPERTY</span>' : '';
        document.title = 'Agreement ' + t.kode + ' | ' + toko.nama;
        isi.innerHTML = '<article class="nota">' + L.kopNota('Purchase Agreement', t.kode, cap) +
            '<p style="margin:14px 0 0;font-weight:700">Sale of a watch with a right to buy it back</p>' +
            '<dl class="nota-info">' +
            '<div><dt>Buyer</dt><dd>' + E(toko.nama) + '</dd></div>' +
            '<div><dt>Seller</dt><dd>' + E(t.nama) + '</dd></div>' +
            (t.nik_samar ? '<div><dt>NIK</dt><dd>' + E(t.nik_samar) + '</dd></div>' : '') +
            '<div><dt>Phone</dt><dd>' + E(t.hp_samar) + '</dd></div></dl>' +
            '<h2>Item</h2><dl class="nota-info" style="padding-top:6px">' +
            '<div><dt>Watch</dt><dd>' + E(L.namaGitar(t, '–')) + '</dd></div>' + (t.warna ? '<div><dt>Dial colour</dt><dd>' + E(t.warna) + '</dd></div>' : '') +
            (t.no_seri ? '<div><dt>Serial no.</dt><dd>' + E(t.no_seri) + '</dd></div>' : '') +
            (t.kelengkapan ? '<div style="grid-column:1/-1"><dt>Condition</dt><dd>' + E(t.kelengkapan) + '</dd></div>' : '') + '</dl>' +
            '<div class="nota-tot" style="margin-top:14px">' +
            '<div><span>Sale date</span><span>' + L.tgl(t.tgl_beli) + '</span></div>' +
            '<div class="t"><span>Purchase price (paid by ' + (t.metode === 'transfer' ? 'transfer' : 'tunai') + ')</span><span>' + L.rupiah(t.harga_beli) + '</span></div>' +
            '<div><span>Buyback deadline</span><span>' + L.tgl(t.batas_tebus) + '</span></div>' +
            '<div class="s"><span>Buyback price</span><span>' + L.rupiah(L.hargaTebus(t)) + '</span></div>' +
            (t.status === 'ditebus' ? '<div><span>Bought back on</span><span>' + L.tgl(t.tgl_tebus) + '</span></div>' : '') +
            (t.status === 'milik_toko' ? '<div><span>Buyback right ended</span><span>' + L.tgl(t.tgl_berakhir || t.batas_tebus) + '</span></div>' : '') + '</div>' +
            '<h2>Terms</h2><ol>' + L.ketentuanTebus(t).map(function (x) { return '<li>' + E(x) + '</li>'; }).join('') + '</ol>' +
            '<p class="nota-foot">' + (t.disetujui ? 'The seller agreed on WhatsApp on ' + L.tglPanjang(t.disetujui) + '.' : 'Waiting for the seller to agree on WhatsApp (reply AGREE).') +
            '<br>This document was created by ' + E(toko.nama) + ' and can be opened again at jubeliwatch.github.io/agreement.html</p></article>';
        document.getElementById('bar').hidden = false;
    }
    document.getElementById('cetak').addEventListener('click', function () { window.print(); });

    L.halamanKode({ isi: isi, kunci: 'jubeli-perjanjian', jenis: 'tebus', halaman: 'agreement.html', judul: 'Agreement', labelKode: 'Code', contoh: 'TBS-XXXXXX', tombol: 'Open', tampil: surat });
})();
    </script>
</body>
</html>
